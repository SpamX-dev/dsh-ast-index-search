            db_path=$(cd "$project_dir" && ast-index db-path 2>/dev/null) ||
            exit 0

            if [ ! -f "$db_path" ]; then
              # No index yet — SessionStart will pick this up.
              exit 0
            fi


            debounce_ms="${AST_INDEX_HOOK_DEBOUNCE_MS:-5000}"

            case "$debounce_ms" in
              ''|*[!0-9]*) debounce_ms=5000 ;;
            esac


            (cd "$project_dir" && ast-index update --background --debounce-ms
            "$debounce_ms" >/dev/null)


            exit 0
      - index: 111
        fact:
          id: sha256:53fac4a7f766242f0da343fa843a4da55605cb0553c6dd5a2c41ec77fc62edb8
          kind: file
          path: plugin/hooks/scripts/session-start-refresh.sh
          start_line: 1
          end_line: 47
          text: >
            #!/usr/bin/env bash

            # Session-start hook: keep the ast-index fresh between sessions.

            #

            # Behaviour:

            #   * No-op when ast-index is not on PATH.

            #   * Reports when this project's `ast-index watch` daemon is
            already active.

            #   * If an index exists: queue a coordinated background refresh.
            Index-reading

            #     commands wait for that generation before returning results.

            #   * If no index exists: print a one-line hint to stderr so the
            user runs the

            #     initial `ast-index rebuild` themselves; we deliberately don't
            start

            #     a multi-minute rebuild on session start.

            #   * Bypassable via AST_INDEX_HOOK_SKIP_SESSION_START=1 for
            opt-out.


            set -u


            if [ "${AST_INDEX_HOOK_SKIP_SESSION_START:-0}" = "1" ]; then
              exit 0
            fi


            if ! command -v ast-index >/dev/null 2>&1; then
              exit 0
            fi


            project_dir="${CLAUDE_PROJECT_DIR:-$PWD}"


            if (cd "$project_dir" && ast-index watch-status --quiet >/dev/null
            2>&1); then
              echo "ast-index: project watcher is active; the index is already kept fresh." >&2
              exit 0
            fi


            db_path=$(cd "$project_dir" && ast-index db-path 2>/dev/null) ||
            exit 0

            if [ -f "$db_path" ]; then
              debounce_ms="${AST_INDEX_SESSION_DEBOUNCE_MS:-0}"
              case "$debounce_ms" in
                ''|*[!0-9]*) debounce_ms=0 ;;
              esac
              if (cd "$project_dir" && ast-index update --background --debounce-ms "$debounce_ms" >/dev/null); then
                echo "ast-index: project index refresh queued; first index read will wait for it." >&2
              else
                echo "ast-index: could not queue refresh; see the diagnostic above." >&2
              fi
            else
              echo "ast-index: no index for $project_dir — run 'ast-index rebuild' to enable structural search." >&2
            fi


            exit 0
