                for (rank, item) in report.page.items.iter().enumerate() {
                    println!("  {:>3}. {}", rank + 1, item.symbol.render());
                    println!("       {}", item.metrics.render().dimmed());
                }
                if report.page.items.is_empty() {
                    println!("  No symbols matched.");
