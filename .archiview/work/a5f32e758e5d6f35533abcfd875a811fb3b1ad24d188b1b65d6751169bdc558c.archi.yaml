          text: >
            //! Language-specific parsers for symbol extraction

            //!

            //! This module contains parsers for different programming
            languages:

            //! - Kotlin/Java (Android)

            //! - Swift (iOS)

            //! - Objective-C (iOS)

            //! - TypeScript/JavaScript (React, Vue, Svelte, Node.js)

            //! - Perl

            //! - Protocol Buffers (proto2/proto3)

            //! - WSDL/XSD (Web Services)

            //! - C/C++ (JNI bindings, uservices)

            //! - Python (backend services)

            //! - Go (backend services)

            //! - Rust (systems programming)

            //! - Ruby (Rails, RSpec)

            //! - C# (.NET, Unity, ASP.NET)

            //! - PHP (Laravel, Symfony)

            //! - Dart/Flutter


            pub mod perl;

            pub mod typescript;

            pub mod wsdl;


            use crate::db::SymbolKind;


            /// A parsed symbol from source code

            #[derive(Debug, Clone)]

            pub struct ParsedSymbol {
                pub name: String,
                pub kind: SymbolKind,
                pub line: usize,
                /// Last line of the whole definition, 1-based and inclusive. `None` when
                /// the language parser does not report ranges yet.
                pub end_line: Option<usize>,
                pub signature: String,
                pub parents: Vec<(String, String)>, // (parent_name, inherit_kind)
            }


            /// A reference/usage of a symbol

            #[derive(Debug, Clone)]

            pub struct ParsedRef {
                pub name: String,
                pub line: usize,
                pub context: String,
            }


            /// Max length for context strings stored in DB (characters)

            const MAX_CONTEXT_LEN: usize = 500;


            /// Max length for symbol signatures stored in DB. Parsers commonly
            use

            /// `line_text(content, line)` as the signature, which copies the
            *entire*

            /// source line. On a minified bundle one line can be the whole file
            (tens of

            /// megabytes), and there are thousands of symbols per file —
            multiplying out

            /// to easily 100+ GB of heap during a single rebuild. Truncating at
            the DB

            /// insert side caps that at `(MAX_SIGNATURE_LEN + 3) bytes per
            row`.

            pub(crate) const MAX_SIGNATURE_LEN: usize = 500;


            /// Truncate context to avoid storing huge minified lines

            fn truncate_context(s: &str) -> String {
                truncate_to_len(s, MAX_CONTEXT_LEN)
            }


            /// Public truncation for signatures, called from
            `indexer::write_batch_to_db`

            /// just before INSERT — one chokepoint instead of 220 callsites.

            pub fn truncate_signature(s: &str) -> String {
                truncate_to_len(s, MAX_SIGNATURE_LEN)
            }


            fn truncate_to_len(s: &str, max: usize) -> String {
                if s.len() <= max {
                    s.to_string()
                } else {
                    let mut end = max;
                    while end < s.len() && !s.is_char_boundary(end) {
                        end += 1;
                    }
                    format!("{}...", &s[..end.min(s.len())])
                }
            }


            use anyhow::Result;

            use regex::Regex;

            use std::collections::{HashMap, HashSet};

            use std::sync::LazyLock;


            /// Strip // line comments only (no block comments). Used for BSL.

            fn strip_line_comments(content: &str) -> String {
                let mut result = String::with_capacity(content.len());
                for line in content.lines() {
                    if let Some(pos) = line.find("//") {
                        result.push_str(&line[..pos]);
                        // Pad with spaces to preserve column positions
                        for _ in 0..(line.len() - pos) {
                            result.push(' ');
                        }
                    } else {
                        result.push_str(line);
                    }
                    result.push('\n');
                }
                result
            }


            /// Strip C-style comments (// and /* */) while preserving line
            numbers.

            /// Replaces comment content with spaces so line numbers remain
            correct.

            /// Supports nested block comments for Swift and Rust.

            pub fn strip_c_comments(content: &str, nested: bool) -> String {
                let bytes = content.as_bytes();
                let len = bytes.len();
                let mut result = Vec::with_capacity(len);
                let mut i = 0;

                while i < len {
                    if i + 1 < len && bytes[i] == b'/' && bytes[i + 1] == b'/' {
                        // Single-line comment: replace with spaces until newline
                        while i < len && bytes[i] != b'\n' {
                            result.push(b' ');
                            i += 1;
                        }
                    } else if i + 1 < len && bytes[i] == b'/' && bytes[i + 1] == b'*' {
                        // Block comment: replace with spaces, preserve newlines
                        result.push(b' ');
                        result.push(b' ');
                        i += 2;
                        let mut depth = 1u32;
                        while i < len && depth > 0 {
                            if nested && i + 1 < len && bytes[i] == b'/' && bytes[i + 1] == b'*' {
                                depth += 1;
                                result.push(b' ');
                                result.push(b' ');
                                i += 2;
                            } else if i + 1 < len && bytes[i] == b'*' && bytes[i + 1] == b'/' {
                                depth -= 1;
                                result.push(b' ');
                                result.push(b' ');
                                i += 2;
                            } else if bytes[i] == b'\n' {
                                result.push(b'\n');
                                i += 1;
                            } else {
                                result.push(b' ');
                                i += 1;
                            }
                        }
                    } else if bytes[i] == b'"' {
                        // Skip string literals to avoid stripping comments inside strings
                        result.push(bytes[i]);
                        i += 1;
                        while i < len && bytes[i] != b'"' {
                            if bytes[i] == b'\\' && i + 1 < len {
                                result.push(bytes[i]);
                                result.push(bytes[i + 1]);
                                i += 2;
                            } else if bytes[i] == b'\n' {
                                result.push(b'\n');
                                i += 1;
                                break; // unterminated string
                            } else {
                                result.push(bytes[i]);
                                i += 1;
                            }
                        }
                        if i < len {
                            result.push(bytes[i]);
                            i += 1;
                        }
                    } else {
                        result.push(bytes[i]);
                        i += 1;
                    }
                }

                String::from_utf8(result).unwrap_or_else(|_| content.to_string())
            }


            /// Strip hash comments (Python, Ruby, Perl) while preserving line
            numbers.

            pub fn strip_hash_comments(content: &str) -> String {
                content
                    .lines()
                    .map(|line| {
                        // Find # not inside a string
                        let mut in_single = false;
                        let mut in_double = false;
                        let mut prev_was_escape = false;
                        let bytes = line.as_bytes();
                        for (idx, &b) in bytes.iter().enumerate() {
                            if prev_was_escape {
                                prev_was_escape = false;
                                continue;
                            }
                            if b == b'\\' {
                                prev_was_escape = true;
                                continue;
                            }
                            if b == b'\'' && !in_double {
                                in_single = !in_single;
                            } else if b == b'"' && !in_single {
                                in_double = !in_double;
                            } else if b == b'#' && !in_single && !in_double {
                                // Replace from # to end with spaces
                                let mut result = String::with_capacity(line.len());
                                result.push_str(&line[..idx]);
                                for _ in idx..line.len() {
                                    result.push(' ');
                                }
                                return result;
                            }
                        }
                        line.to_string()
                    })
                    .collect::<Vec<_>>()
                    .join("\n")
            }


            /// Strip Python docstrings (""" ... """) while preserving line
            numbers.

            pub fn strip_python_docstrings(content: &str) -> String {
                let bytes = content.as_bytes();
                let len = bytes.len();
                let mut result = Vec::with_capacity(len);
                let mut i = 0;

                while i < len {
                    if i + 2 < len && bytes[i] == b'"' && bytes[i + 1] == b'"' && bytes[i + 2] == b'"' {
                        // Triple-quoted string: replace with spaces, preserve newlines
                        result.push(b' ');
                        result.push(b' ');
                        result.push(b' ');
                        i += 3;
                        while i < len {
                            if i + 2 < len && bytes[i] == b'"' && bytes[i + 1] == b'"' && bytes[i + 2] == b'"' {
                                result.push(b' ');
                                result.push(b' ');
                                result.push(b' ');
                                i += 3;
                                break;
                            } else if bytes[i] == b'\n' {
                                result.push(b'\n');
                                i += 1;
                            } else {
                                result.push(b' ');
                                i += 1;
                            }
                        }
                    } else if i + 2 < len && bytes[i] == b'\'' && bytes[i + 1] == b'\'' && bytes[i + 2] == b'\''
                    {
                        // Triple single-quoted string
                        result.push(b' ');
                        result.push(b' ');
                        result.push(b' ');
                        i += 3;
                        while i < len {
                            if i + 2 < len
                                && bytes[i] == b'\''
                                && bytes[i + 1] == b'\''
                                && bytes[i + 2] == b'\''
                            {
                                result.push(b' ');
                                result.push(b' ');
                                result.push(b' ');
                                i += 3;
                                break;
                            } else if bytes[i] == b'\n' {
                                result.push(b'\n');
                                i += 1;
                            } else {
                                result.push(b' ');
                                i += 1;
                            }
                        }
                    } else {
                        result.push(bytes[i]);
                        i += 1;
                    }
                }

                String::from_utf8(result).unwrap_or_else(|_| content.to_string())
            }


            /// Strip Ruby block comments (=begin ... =end) while preserving
            line numbers.

            pub fn strip_ruby_block_comments(content: &str) -> String {
                let mut result = String::with_capacity(content.len());
                let mut in_block = false;
                for line in content.lines() {
                    if line.starts_with("=begin") {
                        in_block = true;
                        result.push_str(&" ".repeat(line.len()));
                        result.push('\n');
                    } else if line.starts_with("=end") && in_block {
                        in_block = false;
                        result.push_str(&" ".repeat(line.len()));
                        result.push('\n');
                    } else if in_block {
                        result.push_str(&" ".repeat(line.len()));
                        result.push('\n');
                    } else {
                        result.push_str(line);
                        result.push('\n');
                    }
                }
                // Remove trailing newline if original didn't have one
                if !content.ends_with('\n') && result.ends_with('\n') {
                    result.pop();
                }
                result
            }


            /// Strip Perl POD documentation (=pod/=head ... =cut) while
            preserving line numbers.

            pub fn strip_perl_pod(content: &str) -> String {
                let mut result = String::with_capacity(content.len());
                let mut in_pod = false;
                for line in content.lines() {
                    let trimmed = line.trim_start();
                    if trimmed.starts_with("=pod")
                        || trimmed.starts_with("=head")
                        || trimmed.starts_with("=over")
                        || trimmed.starts_with("=item")
                        || trimmed.starts_with("=begin")
                        || trimmed.starts_with("=for")
                        || trimmed.starts_with("=encoding")
                    {
                        in_pod = true;
                        result.push_str(&" ".repeat(line.len()));
                        result.push('\n');
                    } else if trimmed.starts_with("=cut") && in_pod {
                        in_pod = false;
                        result.push_str(&" ".repeat(line.len()));
                        result.push('\n');
                    } else if in_pod {
                        result.push_str(&" ".repeat(line.len()));
                        result.push('\n');
                    } else {
                        result.push_str(line);
                        result.push('\n');
                    }
                }
                if !content.ends_with('\n') && result.ends_with('\n') {
                    result.pop();
                }
                result
            }


            /// Strip Matlab comments (% line and %{ ... %} block) while
            preserving line numbers.

            pub fn strip_matlab_comments(content: &str) -> String {
                let mut result = String::with_capacity(content.len());
                let mut in_block = false;
                for line in content.lines() {
                    let trimmed = line.trim();
                    if !in_block && trimmed == "%{" {
                        in_block = true;
                        result.push_str(&" ".repeat(line.len()));
                        result.push('\n');
                    } else if in_block && trimmed == "%}" {
                        in_block = false;
                        result.push_str(&" ".repeat(line.len()));
                        result.push('\n');
                    } else if in_block {
                        result.push_str(&" ".repeat(line.len()));
                        result.push('\n');
                    } else {
                        // Find % not inside a string
                        let mut in_single = false;
                        let bytes = line.as_bytes();
                        let mut found = None;
                        for (idx, &b) in bytes.iter().enumerate() {
                            if b == b'\'' {
                                in_single = !in_single;
                            } else if b == b'%' && !in_single {
                                found = Some(idx);
                                break;
                            }
                        }
                        if let Some(idx) = found {
                            result.push_str(&line[..idx]);
                            for _ in idx..line.len() {
                                result.push(' ');
                            }
                        } else {
                            result.push_str(line);
                        }
                        result.push('\n');
                    }
                }
                if !content.ends_with('\n') && result.ends_with('\n') {
                    result.pop();
                }
                result
            }


            /// Strip XML comments (<!-- ... -->) while preserving line numbers.

            pub fn strip_xml_comments(content: &str) -> String {
                let bytes = content.as_bytes();
                let len = bytes.len();
                let mut result = Vec::with_capacity(len);
                let mut i = 0;

                while i < len {
                    if i + 3 < len
                        && bytes[i] == b'<'
                        && bytes[i + 1] == b'!'
                        && bytes[i + 2] == b'-'
                        && bytes[i + 3] == b'-'
                    {
                        // XML comment: replace with spaces, preserve newlines
                        result.push(b' ');
                        result.push(b' ');
                        result.push(b' ');
                        result.push(b' ');
                        i += 4;
                        while i < len {
                            if i + 2 < len && bytes[i] == b'-' && bytes[i + 1] == b'-' && bytes[i + 2] == b'>' {
                                result.push(b' ');
                                result.push(b' ');
                                result.push(b' ');
                                i += 3;
                                break;
                            } else if bytes[i] == b'\n' {
                                result.push(b'\n');
                                i += 1;
                            } else {
                                result.push(b' ');
                                i += 1;
                            }
                        }
                    } else {
                        result.push(bytes[i]);
                        i += 1;
                    }
                }

                String::from_utf8(result).unwrap_or_else(|_| content.to_string())
            }


            // Re-export parser functions for fallback languages (no tree-sitter
