                    let symbols = parse_perl_symbols(content).unwrap();
                    let pkg = symbols.iter().find(|s| s.name == "MyModule").unwrap();
                    assert!(pkg.parents.iter().any(|(p, _)| p == "Base::Class"));
                }

                #[test]
