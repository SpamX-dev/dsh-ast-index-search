            }


            impl FileType {
                /// Determine file type from extension, returns None for unsupported extensions
                pub fn from_extension(ext: &str) -> Option<FileType> {
                    match ext {
                        "bsl" | "os" => Some(FileType::Bsl),
                        "lisp" | "lsp" | "cl" | "asd" => Some(FileType::CommonLisp),
                        "kt" => Some(FileType::Kotlin),
                        "java" => Some(FileType::Java),
                        "swift" => Some(FileType::Swift),
                        "m" => Some(FileType::ObjC),
                        "h" => Some(FileType::Cpp), // .h can be ObjC or C++, default to C++
                        "pm" | "pl" | "t" => Some(FileType::Perl),
                        "proto" => Some(FileType::Proto),
                        "wsdl" | "xsd" => Some(FileType::Wsdl),
                        "cpp" | "cc" | "c" | "hpp" => Some(FileType::Cpp),
                        "py" => Some(FileType::Python),
                        "go" => Some(FileType::Go),
                        "rs" => Some(FileType::Rust),
                        "rb" => Some(FileType::Ruby),
                        "cs" => Some(FileType::CSharp),
                        "dart" => Some(FileType::Dart),
                        "ts" | "tsx" | "mts" | "js" | "jsx" | "mjs" | "cjs" => Some(FileType::TypeScript),
                        "vue" => Some(FileType::Vue),
                        "svelte" => Some(FileType::Svelte),
                        "scala" | "sc" => Some(FileType::Scala),
                        "php" | "phtml" => Some(FileType::Php),
                        "lua" => Some(FileType::Lua),
                        "ex" | "exs" => Some(FileType::Elixir),
                        "gd" => Some(FileType::Gdscript),
                        "sh" | "bash" | "zsh" => Some(FileType::Bash),
                        "sql" => Some(FileType::Sql),
                        "groovy" | "gradle" => Some(FileType::Groovy),
                        "r" | "R" => Some(FileType::R),
                        "zig" | "zon" => Some(FileType::Zig),
                        "css" | "pcss" | "postcss" => Some(FileType::Css),
                        "scss" => Some(FileType::Scss),
                        "less" => Some(FileType::Less),
                        _ => None,
                    }
                }

                /// Detect whether a `.m` file is Matlab or Objective-C by inspecting content.
                /// Scans up to 50 lines accumulating evidence before deciding.
                pub fn detect_m_file_type(content: &str) -> FileType {
                    let mut saw_percent_comment = false;

                    for line in content.lines().take(50) {
                        let trimmed = line.trim();
                        if trimmed.is_empty() {
                            continue;
                        }

                        // % comments are Matlab-only (never valid ObjC at line start)
                        if trimmed.starts_with('%') {
                            saw_percent_comment = true;
                            continue;
                        }

                        // Strong ObjC markers — immediate return
                        if trimmed.starts_with("#import")
                            || trimmed.starts_with("#include")
                            || trimmed.starts_with("#pragma")
                            || trimmed.starts_with("@interface")
                            || trimmed.starts_with("@implementation")
                            || trimmed.starts_with("@protocol")
                            || trimmed.starts_with("@property")
                            || trimmed.starts_with("@synthesize")
                            || trimmed.starts_with("@dynamic")
                            || trimmed.starts_with("@end")
                        {
                            return FileType::ObjC;
                        }

                        // Strong Matlab markers — immediate return
                        // Use word boundaries: "function " not "functionality"
                        if trimmed.starts_with("classdef ")
                            || trimmed.starts_with("classdef(")
                            || trimmed == "classdef"
                            || trimmed.starts_with("function ")
                            || trimmed.starts_with("function[")
                            || trimmed == "function"
                        {
                            return FileType::Matlab;
                        }

                        // C-style comments → ObjC
                        if trimmed.starts_with("//") || trimmed.starts_with("/*") {
                            return FileType::ObjC;
                        }
                    }

                    // If % comments found but no strong markers → Matlab
                    if saw_percent_comment {
                        return FileType::Matlab;
                    }

                    // Default to ObjC (backward compatible)
                    FileType::ObjC
                }
            }


            /// Detect whether a `.h` file contains Objective-C by looking for
            ObjC markers.

            pub fn detect_h_file_objc(content: &str) -> bool {
                for line in content.lines().take(50) {
                    let trimmed = line.trim();
                    if trimmed.starts_with("#import")
                        || trimmed.starts_with("@interface")
                        || trimmed.starts_with("@protocol")
                        || trimmed.starts_with("@property")
                        || trimmed.starts_with("@class")
                        || trimmed.starts_with("NS_ASSUME_NONNULL_BEGIN")
                    {
                        return true;
                    }
                }
                false
            }


            /// Check if file extension is supported for indexing

            pub fn is_supported_extension(ext: &str) -> bool {
                FileType::from_extension(ext).is_some()
            }


            /// Strip comments from content based on file type, preserving line
            numbers

            fn strip_comments(content: &str, file_type: FileType) -> String {
                match file_type {
                    // C-style comments (no nesting)
                    // BSL: only // line comments, no block comments /* */
                    FileType::Bsl => strip_line_comments(content),
                    // C-style comments (no nesting)
                    FileType::Kotlin
                    | FileType::Java
                    | FileType::ObjC
                    | FileType::Go
                    | FileType::CSharp
                    | FileType::Proto
                    | FileType::TypeScript
                    | FileType::Dart
                    | FileType::Cpp
                    | FileType::Scala
                    | FileType::Php
                    | FileType::Groovy
                    | FileType::Lua => strip_c_comments(content, false),
                    // C-style comments with nesting support
                    FileType::Swift | FileType::Rust => strip_c_comments(content, true),
                    // Hash comments + docstrings
                    FileType::Python => {
                        let stripped = strip_python_docstrings(content);
                        strip_hash_comments(&stripped)
                    }
                    // Hash + =begin/=end blocks
                    FileType::Ruby => {
                        let stripped = strip_ruby_block_comments(content);
                        strip_hash_comments(&stripped)
                    }
                    // Hash + POD
                    FileType::Perl => {
                        let stripped = strip_perl_pod(content);
                        strip_hash_comments(&stripped)
                    }
                    // XML comments
                    FileType::Wsdl => strip_xml_comments(content),
                    // Hash comments
                    FileType::Bash | FileType::R | FileType::Elixir | FileType::Gdscript => {
                        strip_hash_comments(content)
                    }

                    // Matlab: % line comments and %{ %} block comments
                    FileType::Matlab => strip_matlab_comments(content),
                    // SQL: -- line comments and /* */ block comments (C-style)
                    FileType::Sql => strip_c_comments(content, false),
                    // Zig: only // line comments — no block comments in the language.
                    FileType::Zig => strip_line_comments(content),
                    // CSS: only /* */ block comments. SCSS / Less also support // line
                    // comments. Tree-sitter handles them natively; this fallback runs
                    // only for non-tree-sitter paths (refs / search) and is safe.
                    FileType::Css | FileType::Scss | FileType::Less => strip_c_comments(content, false),

                    // Vue/Svelte: comments stripped after script extraction
                    // Common Lisp: tree-sitter handles comments natively (unreachable)
                    FileType::Vue | FileType::Svelte | FileType::CommonLisp => content.to_string(),
                }
            }


            pub mod treesitter;


            /// Parse symbols and references from file content using FileType
            enum.

            /// Tries tree-sitter first for supported languages, falls back to
            regex.

            pub fn parse_file_symbols(
                content: &str,
                file_type: FileType,
            ) -> Result<(Vec<ParsedSymbol>, Vec<ParsedRef>)> {
                // For .h files (mapped to Cpp), sniff content for ObjC markers and re-route
                let effective_type = if file_type == FileType::Cpp && detect_h_file_objc(content) {
                    FileType::ObjC
                } else {
                    file_type
                };

                // Try tree-sitter parser first
                if let Some(ts_parser) = treesitter::get_treesitter_parser(effective_type) {
                    return ts_parser.parse_symbols_and_refs(content, effective_type);
                }

                // Fallback: regex-based parsing for unsupported languages
                let stripped = strip_comments(content, file_type);
                let content = &stripped;

                let symbols = match file_type {
                    FileType::Perl => parse_perl_symbols(content)?,
                    FileType::Wsdl => parse_wsdl_symbols(content)?,
                    FileType::Vue => {
                        let script = extract_vue_script(content);
                        let script_stripped = strip_c_comments(&script, false);
                        parse_typescript_symbols(&script_stripped)?
                    }
                    FileType::Svelte => {
                        let script = extract_svelte_script(content);
                        let script_stripped = strip_c_comments(&script, false);
                        parse_typescript_symbols(&script_stripped)?
                    }
                    // All other types are handled by tree-sitter above
                    _ => return Err(anyhow::anyhow!("No parser for {:?}", file_type)),
                };
                let refs = extract_references_for_lang(content, &symbols, Some(file_type))?;
                Ok((symbols, refs))
            }


            /// Parse only the symbols of a file, skipping reference extraction.

            ///

            /// Used for inputs indexed purely for their definitions —
            `node_modules` type

            /// declarations — where references would describe a library's own
            internals.

            pub fn parse_file_symbols_only(content: &str, file_type: FileType)
            -> Result<Vec<ParsedSymbol>> {
                let effective_type = if file_type == FileType::Cpp && detect_h_file_objc(content) {
                    FileType::ObjC
                } else {
                    file_type
                };

                if let Some(ts_parser) = treesitter::get_treesitter_parser(effective_type) {
                    return ts_parser.parse_symbols(content);
                }

                let stripped = strip_comments(content, file_type);
                let content = &stripped;

                match file_type {
                    FileType::Perl => parse_perl_symbols(content),
                    FileType::Wsdl => parse_wsdl_symbols(content),
                    FileType::Vue => {
                        let script = extract_vue_script(content);
                        let script_stripped = strip_c_comments(&script, false);
                        parse_typescript_symbols(&script_stripped)
                    }
                    FileType::Svelte => {
                        let script = extract_svelte_script(content);
                        let script_stripped = strip_c_comments(&script, false);
                        parse_typescript_symbols(&script_stripped)
                    }
                    _ => Err(anyhow::anyhow!("No parser for {:?}", file_type)),
                }
            }


            /// Reserved words of the languages whose reference extraction runs
            through

            /// the generic line scan. A reserved word can never name a symbol,
            so a match

            /// on one — `sizeof (x)`, `#if defined(X)`, Go's `func (r *T)`,
            Rust's

            /// `pub(crate)`, Python's `except (A, B):` or `None` — is never a
            reference.

            ///

            /// Contextual keywords that are ordinary identifiers elsewhere
            (Python's

            /// `match` and `type`, Rust's `union`, JavaScript's `async`) are
            left out: a

            /// function may well carry those names.

            fn reserved_words(file_type: Option<FileType>) -> &'static
            HashSet<&'static str> {
                fn words(list: &'static str) -> HashSet<&'static str> {
                    list.split_whitespace().collect()
                }
                static NONE: LazyLock<HashSet<&str>> = LazyLock::new(HashSet::new);
                // C and C++ share `FileType::Cpp` (and `.h`), so the set covers both,
                // plus preprocessor operators and the GNU / MSVC spellings of keywords.
                // `new` and `delete` stay out: they are valid C function names.
                static C_FAMILY: LazyLock<HashSet<&str>> = LazyLock::new(|| {
                    words(
                        "auto break case char const continue default do double else enum extern float for
                         goto if inline int long register restrict return short signed sizeof static struct
                         switch typedef union unsigned void volatile while _Alignas _Alignof _Atomic _Bool
                         _Complex _Generic _Imaginary _Noreturn _Static_assert _Thread_local alignas alignof
                         bool false nullptr static_assert thread_local true typeof asm decltype noexcept
                         operator requires typeid co_await co_return co_yield defined _Pragma __has_include
                         __has_include_next __has_attribute __has_cpp_attribute __has_builtin __has_feature
                         __has_extension __attribute__ __attribute __declspec __asm__ __asm __typeof__
                         __typeof __alignof__ __volatile__ __extension__ __restrict __restrict__ __inline
                         __inline__ __forceinline",
                    )
                });
                static GO: LazyLock<HashSet<&str>> = LazyLock::new(|| {
                    words(
                        "break case chan const continue default defer else fallthrough for func go goto if
                         import interface map package range return select struct switch type var",
                    )
                });
                static PYTHON: LazyLock<HashSet<&str>> = LazyLock::new(|| {
                    words(
                        "False None True and as assert async await break class continue def del elif else
                         except finally for from global if import in is lambda nonlocal not or pass raise
                         return try while with yield",
                    )
                });
                static RUST: LazyLock<HashSet<&str>> = LazyLock::new(|| {
                    words(
                        "as async await break const continue crate dyn else enum extern false fn for if impl
                         in let loop match mod move mut pub ref return self Self static struct super trait
                         true type unsafe use where while abstract become box do final macro override priv
                         try typeof unsized virtual yield",
                    )
                });
                static PERL: LazyLock<HashSet<&str>> = LazyLock::new(|| {
                    words(
                        "if elsif else unless until while for foreach do my our local state return sub and
                         or not xor eq ne lt gt le ge cmp",
                    )
                });
                static JAVASCRIPT: LazyLock<HashSet<&str>> = LazyLock::new(|| {
                    words(
                        "await break case catch class const continue debugger default delete do else enum
                         export extends false finally for function if implements import in instanceof
                         interface let new null package private protected public return static super switch
                         this throw true try typeof var void while with yield",
                    )
                });
                match file_type {
                    Some(FileType::Cpp) | Some(FileType::ObjC) => &C_FAMILY,
                    Some(FileType::Go) => &GO,
                    Some(FileType::Python) => &PYTHON,
                    Some(FileType::Rust) => &RUST,
                    Some(FileType::Perl) => &PERL,
                    Some(FileType::TypeScript) | Some(FileType::Vue) | Some(FileType::Svelte) => &JAVASCRIPT,
                    _ => &NONE,
                }
            }


            /// Whether the text before a match makes it a member or a path
            segment

            /// (`map.delete(k)`, `$obj->xor(...)`, `Pkg::local(...)`).
            JavaScript and

            /// Perl allow reserved words there, so the reserved-word filter
            must not apply.

            fn follows_member_access(before: &str) -> bool {
                before.ends_with('.') || before.ends_with("->") || before.ends_with("::")
            }


            /// Extract references/usages from file content

            pub fn extract_references(
                content: &str,
                defined_symbols: &[ParsedSymbol],
            ) -> Result<Vec<ParsedRef>> {
                extract_references_for_lang(content, defined_symbols, None)
            }


            /// Extract references/usages from file content, with optional
            language-specific filtering

            pub fn extract_references_for_lang(
                content: &str,
                defined_symbols: &[ParsedSymbol],
                file_type: Option<FileType>,
            ) -> Result<Vec<ParsedRef>> {
                let mut refs = Vec::new();

                // Map every locally defined symbol to the line it is declared on. Only that
                // line is skipped: a symbol used further down its own file (a constant fed
                // into the next constant, a local interface passed to defineProps) is a real
                // usage, and skipping the whole name hid it from `usages` entirely.
                //
                // A qualified name declares its last segment where the line spells the
                // name out: `class Billing::Invoice` declares that `Invoice`, which the
                // identifier scan below sees on its own. `Billing` stays a reference to
                // the namespace, and so does the `Invoice` of `class Admin::Invoice <
                // Invoice`, a different class.
                //
                // Imports are not declarations: `use crate::models::Widget;` is the first
                // real use of `Widget` in the file, and treating it as the declaration of
                // its own last segment dropped every Rust import from `usages`.
                let mut declared_at: HashMap<&str, HashSet<usize>> = HashMap::new();
                let mut qualified_at: HashMap<(usize, &str), Vec<&str>> = HashMap::new();
                for symbol in defined_symbols {
                    if symbol.kind == SymbolKind::Import {
                        continue;
                    }
                    declared_at
                        .entry(symbol.name.as_str())
                        .or_default()
                        .insert(symbol.line);
                    let segment = crate::db::last_name_segment(&symbol.name);
                    if segment.len() < symbol.name.len() {
                        qualified_at
                            .entry((symbol.line, segment))
                            .or_default()
                            .push(symbol.name.as_str());
                    }
                }
                let is_declared_segment = |line: &str, found: regex::Match<'_>, line_num: usize| {
                    qualified_at
                        .get(&(line_num, found.as_str()))
                        .is_some_and(|names| names.iter().any(|name| line[..found.end()].ends_with(name)))
                };
                let is_declaration_line =
                    |name: &str, line: usize| declared_at.get(name).is_some_and(|l| l.contains(&line));

                // Regex for identifiers that might be references:
                // - CamelCase identifiers (types, classes) like PaymentRepository, String
                // - SCREAMING_SNAKE_CASE constants like DEAL_KIND_ICONS, MAX_RETRIES
                // - Function calls like getCards(, process(, update_profile(, _helper(
                //
                // `_` is a word character, so `\b` never fires inside DEAL_KIND_ICONS or
                // update_profile: without `_` in the class the name matches neither whole
                // nor in parts, and every reference to an upper-snake constant or a
                // snake_case function is silently dropped.
                static IDENTIFIER_RE: LazyLock<Regex> =
                    LazyLock::new(|| Regex::new(r"\b([A-Z][A-Za-z0-9_]*)\b").unwrap());

                let identifier_re = &*IDENTIFIER_RE; // CamelCase types
                static FUNC_CALL_RE: LazyLock<Regex> =
                    LazyLock::new(|| Regex::new(r"\b([a-z_][a-zA-Z0-9_]*)\s*\(").unwrap());

                let func_call_re = &*FUNC_CALL_RE; // function calls
                let reserved = reserved_words(file_type);

                // Common keywords to skip across all languages
                static BASE_KEYWORDS: LazyLock<HashSet<&str>> = LazyLock::new(|| {
                    [
                        "if",
                        "else",
                        "while",
                        "for",
                        "do",
                        "try",
                        "catch",
                        "finally",
                        "return",
                        "break",
                        "continue",
                        "throw",
                        "is",
                        "in",
                        "as",
                        "true",
                        "false",
                        "null",
                        "this",
                        "super",
                        "class",
                        "interface",
                        "enum",
                        "import",
                        "package",
                        "private",
                        "public",
                        "protected",
                        "abstract",
                        "final",
                        "typealias",
                        "get",
                        "set",
                        "init",
                        // Universal stdlib noise
                        "String",
                        "Int",
                        "Double",
                        "Float",
                        "Boolean",
                        "Array",
                        "Map",
                        "Set",
                        "List",
                        "Error",
                        "Result",
                    ]
                    .into_iter()
                    .collect()
                });

                // Kotlin/Java-specific keywords and stdlib types
                static KOTLIN_JAVA_KEYWORDS: LazyLock<HashSet<&str>> = LazyLock::new(|| {
                    [
                        "when",
                        "object",
                        "fun",
                        "val",
                        "var",
                        "internal",
                        "override",
                        "open",
                        "sealed",
                        "data",
                        "inner",
                        "companion",
                        "lateinit",
                        "const",
                        "suspend",
                        "inline",
                        "crossinline",
                        "noinline",
                        "reified",
                        "annotation",
                        "constructor",
                        "by",
                        "where",
                        "Long",
                        "Byte",
                        "Short",
                        "Char",
                        "Unit",
                        "Any",
                        "Nothing",
                        "Pair",
                        "Triple",
                        "MutableList",
                        "MutableMap",
                        "MutableSet",
                        "HashMap",
                        "ArrayList",
                        "HashSet",
                        "Exception",
                        "Throwable",
                        "Sequence",
                    ]
                    .into_iter()
                    .collect()
                });

                // Swift-specific keywords and stdlib types
                static SWIFT_KEYWORDS: LazyLock<HashSet<&str>> = LazyLock::new(|| {
                    [
                        "guard",
                        "let",
                        "var",
                        "func",
                        "struct",
                        "protocol",
                        "extension",
                        "where",
                        "override",
                        "mutating",
                        "throws",
                        "rethrows",
                        "async",
                        "await",
                        "some",
                        "weak",
                        "unowned",
                        "lazy",
                        "static",
                        "dynamic",
                        "required",
                        "convenience",
                        "Optional",
                        "Void",
                        "Data",
                        "URL",
                        "Date",
                        "UUID",
                        "Bool",
                        "Character",
                        "UInt",
                        "UInt8",
                        "UInt16",
                        "UInt32",
                        "UInt64",
                        "Int8",
                        "Int16",
                        "Int32",
                        "Int64",
                        "CGFloat",
                        "CGPoint",
                        "CGSize",
                        "CGRect",
                        "NSObject",
                        "AnyObject",
                        "AnyHashable",
                        "Dictionary",
                        "IndexPath",
                        "DispatchQueue",
                        "Codable",
                        "Equatable",
                        "Hashable",
                        "Comparable",
                        "Identifiable",
                        "Sendable",
                        "Decodable",
                        "Encodable",
                        "Any",
                        "Never",
                    ]
                    .into_iter()
                    .collect()
                });

                let base_keywords = &*BASE_KEYWORDS;
                let extra_keywords: &HashSet<&str> = match file_type {
                    Some(FileType::Swift) => &SWIFT_KEYWORDS,
                    Some(FileType::Kotlin) | Some(FileType::Java) => &KOTLIN_JAVA_KEYWORDS,
                    _ => &KOTLIN_JAVA_KEYWORDS, // default for backward compat
                };

                let is_swift = matches!(file_type, Some(FileType::Swift));
                // `&name(...)` always calls a sub in Perl, whatever it is named:
                // perlasm scripts call `&xor`, `&and` and `&sub` this way.
                let is_perl = matches!(file_type, Some(FileType::Perl));

                for (line_num, line) in content.lines().enumerate() {
                    let line_num = line_num + 1;
                    let trimmed = line.trim();

                    // Skip very long lines (minified code, generated files)
                    if trimmed.len() > 2000 {
                        continue;
                    }

                    // Skip import/package declarations
                    // Swift imports can have attribute prefixes: @testable, @_spi(...), @_exported, etc.
                    if trimmed.starts_with("import ")
                        || trimmed.starts_with("package ")
                        || (is_swift && trimmed.starts_with('@') && trimmed.contains("import "))
                    {
                        continue;
                    }

                    // Skip comments
                    if trimmed.starts_with("//") || trimmed.starts_with("/*") || trimmed.starts_with("*") {
                        continue;
                    }

                    let is_reserved = |found: regex::Match| {
                        let before = &line[..found.start()];
                        reserved.contains(found.as_str())
                            && !follows_member_access(before)
                            && !(is_perl && before.ends_with('&'))
                    };

                    // Extract CamelCase types (classes, interfaces, etc.)
                    for caps in identifier_re.captures_iter(line) {
                        let Some(found) = caps.get(1) else { continue };
                        let name = found.as_str();
                        if !name.is_empty()
                            && !base_keywords.contains(name)
                            && !extra_keywords.contains(name)
                            && !is_reserved(found)
                            && !is_declaration_line(name, line_num)
                            && !is_declared_segment(line, found, line_num)
                        {
                            refs.push(ParsedRef {
                                name: name.to_string(),
                                line: line_num,
                                context: truncate_context(trimmed),
                            });
                        }
                    }

                    // Extract function calls
                    for caps in func_call_re.captures_iter(line) {
                        let Some(found) = caps.get(1) else { continue };
                        let name = found.as_str();
                        if !name.is_empty()
                            && !base_keywords.contains(name)
                            && !extra_keywords.contains(name)
                            && !is_reserved(found)
                            && !is_declaration_line(name, line_num)
                            && !is_declared_segment(line, found, line_num)
                        {
                            // Only add if name length > 2 to avoid noise
                            if name.len() > 2 {
                                refs.push(ParsedRef {
                                    name: name.to_string(),
                                    line: line_num,
                                    context: truncate_context(trimmed),
                                });
                            }
                        }
                    }
                }

                Ok(refs)
            }


