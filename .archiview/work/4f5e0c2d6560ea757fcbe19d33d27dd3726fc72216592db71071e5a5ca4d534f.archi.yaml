            module Authentication
              class TokenService
                attr_reader :secret, :expiry

                def initialize(secret:, expiry: 3600)
                  @secret = secret
                  @expiry = expiry
                end

                def generate(user)
                  payload = {
                    user_id: user.id,
                    email: user.email,
                    exp: Time.now.to_i + expiry
                  }
                  encode(payload)
                end

                def verify(token)
                  payload = decode(token)
                  return nil if payload.nil? || expired?(payload)
                  payload
                end

                private

                def encode(payload)
                  # JWT encode
                  payload.to_json
                end

                def decode(token)
                  JSON.parse(token, symbolize_names: true)
                rescue JSON::ParserError
                  nil
                end

                def expired?(payload)
                  payload[:exp] < Time.now.to_i
                end
              end

              class Middleware
                def initialize(app, token_service:)
                  @app = app
                  @token_service = token_service
                end

                def call(env)
                  token = extract_token(env)
                  if token
                    payload = @token_service.verify(token)
                    env['auth.user'] = payload if payload
                  end
                  @app.call(env)
                end

                private

                def extract_token(env)
                  header = env['HTTP_AUTHORIZATION']
                  return nil unless header&.start_with?('Bearer ')
                  header.sub('Bearer ', '')
                end
              end
