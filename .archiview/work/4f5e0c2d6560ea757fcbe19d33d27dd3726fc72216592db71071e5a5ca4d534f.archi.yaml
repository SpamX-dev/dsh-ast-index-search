          text: >
            //! Microbenchmarks for the default (non-experimental) indexing
            pipeline over

            //! small synthetic projects laid out in `TempDir`s.

            //!

            //! Coverage:

            //!   * full source walk + parse: `indexer::index_directory`

            //!   * incremental update after one changed file:
            `update_directory_incremental`

            //!   * module dependency graph build: `index_modules` +
            `index_module_dependencies`

            //!   * Android indexes: `index_xml_usages` + `index_resources`

            //!

            //! Setups are done in Criterion `setup` closures and are *not*
            included in the

            //! measured iteration time. This keeps the measurements focused on
            the pipeline

            //! stage under test while still exercising public APIs against real
            on-disk

            //! fixtures.

            //!

            //! Run with:

            //!     cargo bench --bench index_build

            //!     cargo bench --bench index_build -- --quick


            use std::fs;

            use std::path::{Path, PathBuf};

            use std::sync::OnceLock;

            use std::time::Duration;


            use criterion::{black_box, criterion_group, criterion_main,
            BatchSize, Criterion};

            use tempfile::TempDir;


            use ast_index::{db, indexer};


            const RUST_FILE: &str = r#"

            pub struct Counter { value: u64 }


            impl Counter {
                pub fn new() -> Self { Self { value: 0 } }
                pub fn inc(&mut self) { self.value += 1; }
                pub fn get(&self) -> u64 { self.value }
            }


            pub trait Reporter {
