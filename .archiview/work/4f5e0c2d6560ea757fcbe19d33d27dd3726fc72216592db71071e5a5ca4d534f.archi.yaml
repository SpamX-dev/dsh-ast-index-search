            const GO_FILE: &str = r#"

            package synth


            type Stack struct { items []int }


            func NewStack() *Stack { return &Stack{} }


            func (s *Stack) Push(v int) { s.items = append(s.items, v) }


            func (s *Stack) Pop() (int, bool) {
                n := len(s.items)
                if n == 0 { return 0, false }
                v := s.items[n-1]
                s.items = s.items[:n-1]
