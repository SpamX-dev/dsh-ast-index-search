                    touch(&sub.join(".git/HEAD"));
                    fs::create_dir_all(&sub).unwrap();

                    let home = tmp.path().parent().unwrap();
                    let got = find_project_root_for_read_at_with_db(
                        &sub,
                        Some(home),
                        true, // walk_up enabled
                        db_at(&root),
                    )
                    .unwrap();
                    assert_eq!(
                        got, root,
                        "with walk_up=true, parent DB wins over nested marker"
