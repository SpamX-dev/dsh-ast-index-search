                    /// Filter by file path
                    #[arg(long)]
                    in_file: Option<String>,
                    /// Filter by module path
                    #[arg(long)]
                    module: Option<String>,
                },
                /// Show class hierarchy
                Hierarchy {
                    /// Class name
                    name: String,
                    /// Filter children by file path
                    #[arg(long)]
                    in_file: Option<String>,
                    /// Filter children by module path
                    #[arg(long)]
                    module: Option<String>,
                    /// Maximum number of children to display
                    #[arg(long, default_value = "200")]
                    limit: usize,
                },
                /// Find modules
                Module {
                    /// Module name pattern
                    pattern: String,
                    /// Max results
                    #[arg(short, long, default_value = "20")]
                    limit: usize,
                },
                /// Show module dependencies
                Deps {
                    /// Module name
                    module: String,
                },
                /// Show modules that depend on this module
                Dependents {
                    /// Module name
                    module: String,
                },
                /// Show transitive dependency path(s) between two modules
                ModuleRoute {
                    /// Source module (the one whose dependencies are followed)
                    #[arg(long)]
                    from: String,
                    /// Target module to reach
                    #[arg(long)]
                    to: String,
                    /// Show all simple paths (default: shortest only)
                    #[arg(long)]
                    all: bool,
                    /// Cap on number of paths returned
                    #[arg(long, default_value = "50")]
                    max_paths: usize,
                    /// Cap on path length in hops
                    #[arg(long, default_value = "20")]
                    max_depth: usize,
                    /// Wall-clock guard for path search (milliseconds)
                    #[arg(long, default_value = "5000")]
                    timeout_ms: u64,
                    /// Restrict traversal to a given dep kind ("api", "implementation", "all")
                    #[arg(long, default_value = "all")]
                    via_kind: String,
                },
                /// Find unused dependencies in a module
                UnusedDeps {
                    /// Module name (e.g., features.payments.impl)
                    module: String,
                    /// Show details for each dependency
                    #[arg(long, short)]
                    verbose: bool,
                    /// Skip transitive dependency checking
                    #[arg(long)]
                    no_transitive: bool,
                    /// Skip XML layout checking
                    #[arg(long)]
                    no_xml: bool,
                    /// Skip resource checking
                    #[arg(long)]
                    no_resources: bool,
                    /// Strict mode: only check direct imports (same as --no-transitive --no-xml --no-resources)
                    #[arg(long)]
                    strict: bool,
                },
                /// Find class usages in XML layouts
                XmlUsages {
                    /// Class name to search for
                    class_name: String,
                    /// Filter by module
                    #[arg(long)]
                    module: Option<String>,
                },
                /// Find resource usages
                ResourceUsages {
                    /// Resource name (e.g., @drawable/ic_payment or R.string.app_name). Optional with --unused
                    #[arg(default_value = "")]
                    resource: String,
                    /// Filter by module (required for --unused)
                    #[arg(long)]
                    module: Option<String>,
                    /// Resource type filter (drawable, string, color, etc.)
                    #[arg(long, short = 't')]
                    r#type: Option<String>,
                    /// Show unused resources in a module (requires --module)
                    #[arg(long)]
                    unused: bool,
                },
                /// Show cross-references: definitions, imports, usages
                Refs {
                    /// Symbol name
                    symbol: String,
                    /// Max results per section
                    #[arg(short, long, default_value = "20")]
                    limit: usize,
                    /// Filter by file path
                    #[arg(long)]
                    in_file: Option<String>,
                    /// Filter by module path
                    #[arg(long)]
                    module: Option<String>,
                },
                /// Explore an area: ranked relevant symbols' source + tests, in one shot
                Explore {
                    /// Query: natural-language question or a bag of symbol/file names
                    #[arg(required = true, num_args = 1..)]
                    query: Vec<String>,
                    /// Max source files to include
                    #[arg(short = 'f', long, default_value = "6")]
                    max_files: usize,
                    /// Stage B: re-rank by RWR over an in-memory call/inheritance graph
                    #[arg(long)]
                    rwr: bool,
                },
                /// Find usages of a symbol
                Usages {
                    /// Symbol name
                    symbol: String,
                    /// Max results
                    #[arg(short, long, default_value = "50")]
                    limit: usize,
                    /// Filter by file path
                    #[arg(long)]
                    in_file: Option<String>,
                    /// Filter by module path
                    #[arg(long)]
                    module: Option<String>,
                },
                /// Show symbols in a file with the lines they span
                Outline {
                    /// File path
                    file: String,
                    /// List every symbol: schema dump columns are otherwise folded into a
                    /// count on their table
                    #[arg(long)]
                    full: bool,
                },
                /// Show imports in a file
                Imports {
                    /// File path
                    file: String,
                },
                /// Show public API of a module
                Api {
                    /// Module path (e.g., features/payments/api)
                    module_path: String,
                    /// Max results
                    #[arg(short, long, default_value = "100")]
                    limit: usize,
                },
                /// Show changed files in the current branch (git/arc)
                Changed {
                    /// Base branch (default: trunk for arc; auto-detected for git)
                    #[arg(long)]
                    base: Option<String>,
                    /// VCS subprocess wall-clock timeout in milliseconds
                    #[arg(long, default_value = "30000")]
                    timeout_ms: u64,
                    /// Print VCS/root/timing diagnostics to stderr
                    #[arg(long)]
                    verbose: bool,
                },
                /// Rank files by Git history signals (churn, bugfix ratio, authors, age)
                Hotspots {
                    /// Collect new Git history into the index before reporting
                    #[arg(long)]
                    collect: bool,
                    /// Discard collected signals and rescan the whole history (implies --collect)
                    #[arg(long)]
                    full: bool,
                    /// Max files to list
                    #[arg(short, long, default_value = "20")]
                    limit: usize,
                    /// Skip files with fewer commits than this
                    #[arg(long, default_value = "1")]
                    min_commits: i64,
                    /// Only report files whose path starts with this prefix
                    #[arg(long)]
                    path: Option<String>,
                    /// Leave test files out of the list; percentiles still rank every file
                    #[arg(long)]
                    exclude_tests: bool,
                    /// Ranking key: score, commits, churn, relative-churn, fixes, authors, recent
                    #[arg(long, default_value = "score")]
                    sort: String,
                    /// Git subprocess wall-clock timeout in milliseconds (collection only)
                    #[arg(long, default_value = "600000")]
                    timeout_ms: u64,
                    /// Commits per `git log` window during collection
                    #[arg(long, default_value = "2000")]
                    window: usize,
                    /// Print collection diagnostics to stderr
                    #[arg(long)]
                    verbose: bool,
                },
                /// Symbol dependency graph: dependents, dependencies, impact, paths, cycles, centrality
                Graph {
                    #[command(subcommand)]
                    action: GraphAction,
                },
                // === iOS Commands ===
                /// Find class usages in storyboards/xibs (iOS)
                StoryboardUsages {
                    /// Class name to search for
                    class_name: String,
                    /// Filter by module
                    #[arg(long)]
                    module: Option<String>,
                },
                /// Find iOS asset usages (images, colors from xcassets)
                AssetUsages {
                    /// Asset name to search for. Optional with --unused
                    #[arg(default_value = "")]
                    asset: String,
                    /// Filter by module (required for --unused)
                    #[arg(long)]
                    module: Option<String>,
                    /// Asset type filter (imageset, colorset, etc.)
                    #[arg(long, short = 't')]
                    r#type: Option<String>,
                    /// Show unused assets in a module
                    #[arg(long)]
                    unused: bool,
                },
                /// Find SwiftUI views and state properties
                Swiftui {
                    /// Filter by name or type (State, Binding, Published, ObservedObject)
                    query: Option<String>,
                    /// Max results
                    #[arg(short, long, default_value = "50")]
                    limit: usize,
                },
                /// Find async functions (Swift)
                AsyncFuncs {
                    /// Filter by name
                    query: Option<String>,
                    /// Max results
                    #[arg(short, long, default_value = "50")]
                    limit: usize,
                },
                /// Find Combine publishers (Swift)
                Publishers {
                    /// Filter by name
                    query: Option<String>,
                    /// Max results
                    #[arg(short, long, default_value = "50")]
                    limit: usize,
                },
                /// Find @MainActor functions and classes (Swift)
                MainActor {
                    /// Filter by name
                    query: Option<String>,
                    /// Max results
                    #[arg(short, long, default_value = "50")]
                    limit: usize,
                },
                // === Perl Commands ===
                /// Find Perl exported functions (@EXPORT, @EXPORT_OK)
                PerlExports {
                    /// Filter by module/function name
                    query: Option<String>,
                    /// Max results
                    #[arg(short, long, default_value = "50")]
                    limit: usize,
                },
                /// Find Perl subroutines
                PerlSubs {
                    /// Filter by name
                    query: Option<String>,
                    /// Max results
                    #[arg(short, long, default_value = "50")]
                    limit: usize,
                },
                /// Find POD documentation sections
                PerlPod {
                    /// Filter by heading text
                    query: Option<String>,
                    /// Max results
                    #[arg(short, long, default_value = "50")]
                    limit: usize,
                },
                /// Find Perl test assertions (Test::More, Test::Simple)
                PerlTests {
                    /// Filter by test name or pattern
                    query: Option<String>,
                    /// Max results
                    #[arg(short, long, default_value = "50")]
                    limit: usize,
                },
                /// Find Perl use/require statements
                PerlImports {
                    /// Filter by module name
                    query: Option<String>,
                    /// Max results
                    #[arg(short, long, default_value = "50")]
                    limit: usize,
                },
                // === Project Insights ===
                /// Show compact project map (key types per directory)
                Map {
                    /// Filter by module (enables detailed mode with symbols)
                    #[arg(short, long)]
                    module: Option<String>,
                    /// Max symbols per directory group (detailed mode)
                    #[arg(long, default_value = "5")]
                    per_dir: usize,
                    /// Max directory groups to show
                    #[arg(short, long, default_value = "50")]
                    limit: usize,
                },
                /// Detect project conventions (architecture, frameworks, naming)
                Conventions,
                /// Find potentially unused symbols
                UnusedSymbols {
                    /// Filter by module name or path prefix
                    #[arg(long)]
                    module: Option<String>,
                    /// Only check exported (capitalized) symbols
                    #[arg(long)]
                    export_only: bool,
                    /// Max results
                    #[arg(short, long, default_value = "50")]
                    limit: usize,
                },
                /// Add additional source root to project (legacy; prefer `subtree add`)
                AddRoot {
                    /// Path to add as source root
                    path: String,
                    /// Force add even if path overlaps with project root
                    #[arg(long)]
                    force: bool,
                },
                /// Remove source root from project (legacy; prefer `subtree remove`)
                RemoveRoot {
                    /// Path to remove
                    path: String,
                },
                /// List configured source roots (legacy; prefer `subtree list`)
                ListRoots,
                /// Manage named workspace subtrees attached to this project
                Subtree {
                    #[command(subcommand)]
                    action: SubtreeAction,
                },
                /// Watch for file changes and auto-update index
                Watch,
                /// Report whether this project has an active watcher
                WatchStatus {
                    /// Suppress output and communicate status only through the exit code
                    #[arg(long)]
                    quiet: bool,
                },
                /// Clear index database for current project
                Clear,
                /// Show version
                Version,
                /// Install Claude Code plugin to ~/.claude/plugins/
                InstallClaudePlugin,
                /// Register ast-index MCP server in Codex
                InstallCodexMcp {
                    /// Print the Codex command and config fallback without changing Codex config
                    #[arg(long)]
                    dry_run: bool,
                },
                /// Detect every stack present in the current project root by marker files
                DetectStacks,
                /// Install git hooks that auto-update the index on checkout / merge / rewrite
                InstallGitHooks {
                    /// Overwrite existing ast-index hook scripts
                    #[arg(long)]
                    force: bool,
                    /// Print the hook script paths and contents without writing anything
                    #[arg(long)]
                    dry_run: bool,
                },
                // === Programmatic Access ===
                /// Structural code search via ast-grep (requires `sg` installed)
                Agrep {
                    /// AST pattern to match (e.g., "router.launch($$$)")
                    pattern: String,
                    /// Language filter (kotlin, java, typescript, swift, python, rust, go, etc.)
                    #[arg(short, long)]
                    lang: Option<String>,
                    /// Output as JSON
                    #[arg(long)]
                    json: bool,
                },
                /// Execute raw SQL query against the index database (SELECT only)
                Query {
                    /// SQL query (SELECT statements only)
                    sql: String,
                    /// Max rows to return
                    #[arg(short, long, default_value = "100")]
                    limit: usize,
                },
                /// Print path to the SQLite index database
                DbPath,
                /// Show database schema (tables and columns)
                Schema,
            }


            #[derive(Subcommand)]

            enum SubtreeAction {
                /// Attach a named subtree to this project (the path may be relative or absolute)
                Add {
                    /// Short human-friendly name shown in CLI output and used with `--subtree`
                    name: String,
                    /// Path to attach (relative to the current directory or absolute)
                    path: String,
                    /// Allow attaching a subtree that overlaps with the project root
                    #[arg(long)]
                    force: bool,
                },
                /// Detach a subtree by name
                Remove {
                    /// Subtree name (use `subtree list` to discover existing names)
                    name: String,
                },
                /// List every subtree attached to this project
                List,
            }


            #[derive(clap::Args)]

            struct GraphSymbolArgs {
                /// Only symbols whose file path contains this substring
                #[arg(long)]
                in_file: Option<String>,
                /// Only symbols of this kind (class, function, property, ...)
                #[arg(long)]
                kind: Option<String>,
            }


            impl GraphSymbolArgs {
                fn filter(self) -> commands::graph::SymbolFilter {
                    commands::graph::SymbolFilter {
                        in_file: self.in_file,
                        kind: self.kind,
                    }
                }
            }


            #[derive(Subcommand)]

            enum GraphAction {
                /// Build (or rebuild) the symbol graph from the current index
                Build {
                    /// Print build phases and timings to stderr
                    #[arg(long)]
                    verbose: bool,
                },
                /// Show whether the graph is built and fresh, with edge counts per confidence level
                Status,
                /// Symbols that depend on SYMBOL (incoming edges), with resolution confidence
                Dependents {
                    /// Symbol name, `Outer::Name`, or `Class#member`
                    symbol: String,
                    #[command(flatten)]
                    filter: GraphSymbolArgs,
                    /// Also list edges whose target name is ambiguous
                    #[arg(long)]
                    include_ambiguous: bool,
                    /// For a class, also cover every definition inside it
                    #[arg(long)]
                    members: bool,
                    /// Leave out dependents defined in test files
                    #[arg(long)]
                    exclude_tests: bool,
                    /// Max edges to list
                    #[arg(short, long, default_value = "50")]
                    limit: usize,
                    /// Rebuild the graph first when it is missing or stale
                    #[arg(long)]
                    refresh: bool,
                },
                /// Symbols SYMBOL depends on (outgoing edges), with resolution confidence
                Dependencies {
                    /// Symbol name, `Outer::Name`, or `Class#member`
                    symbol: String,
                    #[command(flatten)]
                    filter: GraphSymbolArgs,
                    /// Also list edges whose target name is ambiguous
                    #[arg(long)]
                    include_ambiguous: bool,
                    /// For a class, also cover every definition inside it
                    #[arg(long)]
                    members: bool,
                    /// Max edges to list
                    #[arg(short, long, default_value = "50")]
                    limit: usize,
                    /// Rebuild the graph first when it is missing or stale
                    #[arg(long)]
                    refresh: bool,
                },
                /// Blast radius: transitive dependents of SYMBOL per depth, symbols and files
                Impact {
                    /// Symbol name, `Outer::Name`, or `Class#member`
                    symbol: String,
                    #[command(flatten)]
                    filter: GraphSymbolArgs,
                    /// How many hops of dependents to follow
                    #[arg(short, long, default_value = "3")]
                    depth: usize,
                    /// Also follow ambiguous edges (upper bound)
                    #[arg(long)]
                    include_ambiguous: bool,
                    /// For a class, also seed with every definition inside it
                    #[arg(long)]
                    members: bool,
                    /// Neither count nor follow dependents defined in test files
                    #[arg(long)]
                    exclude_tests: bool,
                    /// Max affected symbols to list
                    #[arg(short, long, default_value = "50")]
                    limit: usize,
                    /// Rebuild the graph first when it is missing or stale
                    #[arg(long)]
                    refresh: bool,
                },
                /// Shortest dependency path(s) from FROM to TO; a class stands for itself and its members
                Path {
                    /// Starting symbol (e.g. an entry point)
                    from: String,
                    /// Destination symbol
                    to: String,
                    /// Restrict FROM to files whose path contains this substring
                    #[arg(long)]
                    from_file: Option<String>,
                    /// Restrict TO to files whose path contains this substring
                    #[arg(long)]
                    to_file: Option<String>,
                    /// Give up beyond this many hops
                    #[arg(long, default_value = "8")]
                    max_depth: usize,
                    /// Max shortest paths to list
                    #[arg(long, default_value = "3")]
                    max_paths: usize,
                    /// Also follow ambiguous edges
                    #[arg(long)]
                    include_ambiguous: bool,
                    /// Rebuild the graph first when it is missing or stale
                    #[arg(long)]
                    refresh: bool,
                },
                /// Dependency cycles (strongly connected components over resolved edges)
                Cycles {
                    /// Max components to list
                    #[arg(short, long, default_value = "20")]
                    limit: usize,
                    /// Smallest component size to report
                    #[arg(long, default_value = "2")]
                    min_size: usize,
                    /// Only components with a member under this path prefix
                    #[arg(long)]
                    path: Option<String>,
                    /// Rebuild the graph first when it is missing or stale
                    #[arg(long)]
                    refresh: bool,
                },
                /// Most central symbols (PageRank, fan-in, fan-out or transitive dependents)
                Top {
                    /// Ranking key: pagerank, fan-in, fan-out, dependents
                    #[arg(long, default_value = "pagerank")]
                    sort: String,
                    /// Max symbols to list
                    #[arg(short, long, default_value = "20")]
                    limit: usize,
                    /// Only symbols of this kind (class, function, ...)
                    #[arg(long)]
                    kind: Option<String>,
                    /// Only symbols under this path prefix
                    #[arg(long)]
                    path: Option<String>,
                    /// Skip symbols defined in test files
                    #[arg(long)]
                    exclude_tests: bool,
                    /// Rebuild the graph first when it is missing or stale
                    #[arg(long)]
                    refresh: bool,
                },
                /// Graph metrics (fan-in/out, dependents, PageRank) for one or more symbols
                Metrics {
                    /// Symbol names, `Outer::Name`, or `Class#member`
                    #[arg(required = true, num_args = 1..)]
                    symbols: Vec<String>,
                    #[command(flatten)]
                    filter: GraphSymbolArgs,
                    /// Max symbols to list
                    #[arg(short, long, default_value = "50")]
                    limit: usize,
                    /// Rebuild the graph first when it is missing or stale
                    #[arg(long)]
                    refresh: bool,
                },
            }


            fn main() -> Result<()> {
                let cli = Cli::parse();
                // Export the chosen output format so deeply-nested helpers (PathResolver,
                // formatters in subagents) can branch on text vs JSON without us
                // threading `format` through every signature.
                std::env::set_var("AST_INDEX_FORMAT", cli.format.as_str());
                // Both commands read the working tree's own VCS history rather than the
                // indexed symbol tables, so a subtree filter has nothing to filter.
                if cli.subtree.is_some() {
                    if let Some(name) = match &cli.command {
                        Commands::Changed { .. } => Some("changed"),
                        Commands::Hotspots { .. } => Some("hotspots"),
                        _ => None,
                    } {
                        return Err(anyhow::anyhow!(
                            "--subtree is not supported by '{name}'; invoke it from the desired directory"
                        ));
                    }
                }
                if (cli.subtree.is_some() || cli.local)
                    && matches!(
                        &cli.command,
                        Commands::Graph {
                            action: GraphAction::Build { .. } | GraphAction::Status
                        }
                    )
                {
                    return Err(anyhow::anyhow!(
                        "--subtree/--local do not apply to 'graph build' or 'graph status': \
                         the graph always spans every indexed root; pass them to graph queries instead"
                    ));
                }
                // Conflict guard: --subtree and --local both narrow the workspace, but
                // they narrow it differently, so combining them is meaningless.
                if cli.subtree.is_some() && cli.local {
                    eprintln!("Error: --subtree and --local are mutually exclusive.");
                    std::process::exit(2);
                }
                if let Some(name) = &cli.subtree {
                    std::env::set_var("AST_INDEX_SUBTREE", name);
                }
                if cli.local {
                    std::env::set_var("AST_INDEX_LOCAL_SCOPE", "1");
                }
                // Walk-up is opt-in via CLI flag OR AST_INDEX_WALK_UP env var. CLI wins.
                let walk_up = cli.walk_up
                    || std::env::var("AST_INDEX_WALK_UP")
                        .map(|v| {
                            let t = v.trim();
                            !t.is_empty() && t != "0" && !t.eq_ignore_ascii_case("false")
                        })
                        .unwrap_or(false);
                let cache_independent = matches!(
                    &cli.command,
                    Commands::Version
                        | Commands::InstallClaudePlugin
                        | Commands::InstallCodexMcp { .. }
                        | Commands::DetectStacks
                        | Commands::InstallGitHooks { .. }
                        | Commands::Agrep { .. }
                        | Commands::Changed { .. }
                );
                let changed_command = matches!(&cli.command, Commands::Changed { .. });
                let release_command_publication = matches!(&cli.command, Commands::Watch);
                let (root, mut command_cache_lease) = if changed_command {
                    // `changed` discovers only VCS markers from the invocation directory.
                    // It must never probe or create the ast-index cache.
                    (std::env::current_dir()?, None)
                } else if cache_independent {
                    // These commands use only the working tree or executable metadata.
                    // Keep root detection best-effort so a broken cache path cannot make
                    // `version`, stack detection, installers, hooks, or ast-grep fail.
                    (find_project_root_without_cache()?, None)
                } else {
                    match &cli.command {
                        Commands::Rebuild { .. } | Commands::Restore { .. } | Commands::Clear => {
                            let root = find_project_root_for_write()?;
                            (root, None)
                        }
                        _ => {
                            let (root, lease) = find_project_root_for_read_with_lease(walk_up)?;
                            (root, lease)
                        }
                    }
                };
                let format = cli.format.as_str();

                // Migrate project DB from old kotlin-index to ast-index
                if !cache_independent && command_cache_lease.is_none() {
                    command_cache_lease = Some(db::migrate_legacy_project_with_lease(&root)?);
                }
                if release_command_publication {
                    if let Some(lease) = command_cache_lease.as_mut() {
                        lease.release_publication();
                    }
                }
                let _command_cache_lease = command_cache_lease;

                let reads_index = !matches!(
                    &cli.command,
                    Commands::Rebuild { .. }
                        | Commands::Update { .. }
                        | Commands::Restore { .. }
                        | Commands::Clear
                        | Commands::Watch
                        | Commands::WatchStatus { .. }
                        | Commands::AddRoot { .. }
                        | Commands::RemoveRoot { .. }
                        | Commands::Subtree {
                            action: SubtreeAction::Add { .. } | SubtreeAction::Remove { .. }
                        }
                        | Commands::Version
                        | Commands::InstallClaudePlugin
                        | Commands::InstallCodexMcp { .. }
                        | Commands::DetectStacks
                        | Commands::InstallGitHooks { .. }
                        | Commands::Agrep { .. }
                        | Commands::Changed { .. }
                        | Commands::DbPath
                );
                if reads_index && db::db_exists(&root) {
                    let timeout = std::time::Duration::from_millis(
                        std::env::var("AST_INDEX_UPDATE_WAIT_TIMEOUT_MS")
                            .ok()
                            .and_then(|value| value.parse().ok())
                            .unwrap_or(30_000),
                    );
                    db::wait_for_pending_update(&root, timeout)?;
                }

                // Compute directory scope: if cwd is inside project root, limit search to cwd subtree
                let cwd = std::env::current_dir().unwrap_or_default();
                let dir_prefix = if cwd != root {
                    cwd.strip_prefix(&root).ok().map(|rel| {
                        let mut s = rel.to_string_lossy().to_string();
                        if !s.ends_with('/') {
                            s.push('/');
                        }
                        s
                    })
                } else {
                    None
                };
                let dir_prefix_ref = dir_prefix.as_deref();

                match cli.command {
                    // Grep commands
                    Commands::Todo { pattern, limit } => commands::grep::cmd_todo(&root, &pattern, limit),
                    Commands::Callers {
                        function_name,
                        limit,
                        in_file,
                    } => commands::grep::cmd_callers(&root, &function_name, limit, format, in_file.as_deref()),
                    Commands::CallTree {
                        function_name,
                        depth,
                        limit,
                        in_file,
                    } => commands::grep::cmd_call_tree(&root, &function_name, depth, limit, in_file.as_deref()),
                    Commands::Provides { type_name, limit } => {
                        commands::grep::cmd_provides(&root, &type_name, limit)
                    }
                    Commands::Suspend { query, limit } => {
                        commands::grep::cmd_suspend(&root, query.as_deref(), limit)
                    }
                    Commands::Composables { query, limit } => {
