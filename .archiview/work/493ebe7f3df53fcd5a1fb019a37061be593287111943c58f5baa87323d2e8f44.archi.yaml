                    ),
                    Commands::Graph { action } => match action {
                        GraphAction::Build { verbose } => {
                            commands::graph::cmd_graph_build(&root, verbose, format)
                        }
                        GraphAction::Status => commands::graph::cmd_graph_status(&root, format),
                        GraphAction::Dependents {
