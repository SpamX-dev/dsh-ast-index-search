                    } => commands::changed::cmd_changed(&root, base.as_deref(), timeout_ms, verbose, format),
                    Commands::Hotspots {
                        collect,
                        full,
                        limit,
                        min_commits,
                        path,
                        exclude_tests,
                        sort,
                        timeout_ms,
                        window,
                        verbose,
                    } => commands::git_signals::cmd_hotspots(
                        &root,
                        collect,
                        full,
                        limit,
                        min_commits,
                        path.as_deref(),
                        exclude_tests,
                        &sort,
                        timeout_ms,
                        window,
                        verbose,
