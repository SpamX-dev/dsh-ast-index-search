                            filter,
                            depth,
                            include_ambiguous,
                            members,
                            exclude_tests,
                            limit,
                            refresh,
                        } => commands::graph::cmd_graph_impact(
                            &root,
                            &symbol,
                            depth,
                            include_ambiguous,
                            members,
