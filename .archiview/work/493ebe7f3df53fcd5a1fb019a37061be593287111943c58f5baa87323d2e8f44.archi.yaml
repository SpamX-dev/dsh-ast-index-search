                            format,
                        ),
                        GraphAction::Dependencies {
                            symbol,
                            filter,
                            include_ambiguous,
                            members,
                            limit,
                            refresh,
                        } => commands::graph::cmd_graph_edges(
                            &root,
                            &symbol,
                            commands::graph::Direction::Dependencies,
                            include_ambiguous,
                            members,
                            false,
                            &filter.filter(),
