                /// List every subtree attached to this project
                List,
            }


            #[derive(clap::Args)]

            struct GraphSymbolArgs {
                /// Only symbols whose file path contains this substring
                #[arg(long)]
                in_file: Option<String>,
                /// Only symbols of this kind (class, function, property, ...)
                #[arg(long)]
                kind: Option<String>,
            }


            impl GraphSymbolArgs {
                fn filter(self) -> commands::graph::SymbolFilter {
                    commands::graph::SymbolFilter {
                        in_file: self.in_file,
                        kind: self.kind,
                    }
                }
            }


            #[derive(Subcommand)]

            enum GraphAction {
                /// Build (or rebuild) the symbol graph from the current index
                Build {
                    /// Print build phases and timings to stderr
                    #[arg(long)]
                    verbose: bool,
                },
                /// Show whether the graph is built and fresh, with edge counts per confidence level
                Status,
                /// Symbols that depend on SYMBOL (incoming edges), with resolution confidence
                Dependents {
                    /// Symbol name, `Outer::Name`, or `Class#member`
                    symbol: String,
                    #[command(flatten)]
                    filter: GraphSymbolArgs,
                    /// Also list edges whose target name is ambiguous
                    #[arg(long)]
                    include_ambiguous: bool,
                    /// For a class, also cover every definition inside it
                    #[arg(long)]
                    members: bool,
                    /// Leave out dependents defined in test files
                    #[arg(long)]
                    exclude_tests: bool,
                    /// Max edges to list
                    #[arg(short, long, default_value = "50")]
                    limit: usize,
                    /// Rebuild the graph first when it is missing or stale
                    #[arg(long)]
                    refresh: bool,
                },
                /// Symbols SYMBOL depends on (outgoing edges), with resolution confidence
                Dependencies {
                    /// Symbol name, `Outer::Name`, or `Class#member`
                    symbol: String,
                    #[command(flatten)]
                    filter: GraphSymbolArgs,
                    /// Also list edges whose target name is ambiguous
                    #[arg(long)]
                    include_ambiguous: bool,
                    /// For a class, also cover every definition inside it
                    #[arg(long)]
                    members: bool,
                    /// Max edges to list
                    #[arg(short, long, default_value = "50")]
                    limit: usize,
                    /// Rebuild the graph first when it is missing or stale
                    #[arg(long)]
                    refresh: bool,
                },
                /// Blast radius: transitive dependents of SYMBOL per depth, symbols and files
                Impact {
                    /// Symbol name, `Outer::Name`, or `Class#member`
                    symbol: String,
                    #[command(flatten)]
                    filter: GraphSymbolArgs,
                    /// How many hops of dependents to follow
                    #[arg(short, long, default_value = "3")]
                    depth: usize,
                    /// Also follow ambiguous edges (upper bound)
                    #[arg(long)]
                    include_ambiguous: bool,
                    /// For a class, also seed with every definition inside it
                    #[arg(long)]
                    members: bool,
                    /// Neither count nor follow dependents defined in test files
                    #[arg(long)]
                    exclude_tests: bool,
                    /// Max affected symbols to list
                    #[arg(short, long, default_value = "50")]
                    limit: usize,
                    /// Rebuild the graph first when it is missing or stale
                    #[arg(long)]
                    refresh: bool,
                },
                /// Shortest dependency path(s) from FROM to TO; a class stands for itself and its members
                Path {
                    /// Starting symbol (e.g. an entry point)
                    from: String,
                    /// Destination symbol
                    to: String,
                    /// Restrict FROM to files whose path contains this substring
                    #[arg(long)]
                    from_file: Option<String>,
                    /// Restrict TO to files whose path contains this substring
                    #[arg(long)]
                    to_file: Option<String>,
                    /// Give up beyond this many hops
                    #[arg(long, default_value = "8")]
                    max_depth: usize,
                    /// Max shortest paths to list
                    #[arg(long, default_value = "3")]
                    max_paths: usize,
                    /// Also follow ambiguous edges
                    #[arg(long)]
                    include_ambiguous: bool,
                    /// Rebuild the graph first when it is missing or stale
                    #[arg(long)]
                    refresh: bool,
                },
                /// Dependency cycles (strongly connected components over resolved edges)
                Cycles {
                    /// Max components to list
                    #[arg(short, long, default_value = "20")]
                    limit: usize,
                    /// Smallest component size to report
                    #[arg(long, default_value = "2")]
                    min_size: usize,
                    /// Only components with a member under this path prefix
                    #[arg(long)]
                    path: Option<String>,
                    /// Rebuild the graph first when it is missing or stale
                    #[arg(long)]
                    refresh: bool,
                },
                /// Most central symbols (PageRank, fan-in, fan-out or transitive dependents)
                Top {
                    /// Ranking key: pagerank, fan-in, fan-out, dependents
                    #[arg(long, default_value = "pagerank")]
                    sort: String,
                    /// Max symbols to list
                    #[arg(short, long, default_value = "20")]
                    limit: usize,
                    /// Only symbols of this kind (class, function, ...)
                    #[arg(long)]
                    kind: Option<String>,
                    /// Only symbols under this path prefix
                    #[arg(long)]
                    path: Option<String>,
                    /// Skip symbols defined in test files
                    #[arg(long)]
                    exclude_tests: bool,
                    /// Rebuild the graph first when it is missing or stale
                    #[arg(long)]
                    refresh: bool,
                },
                /// Graph metrics (fan-in/out, dependents, PageRank) for one or more symbols
                Metrics {
                    /// Symbol names, `Outer::Name`, or `Class#member`
                    #[arg(required = true, num_args = 1..)]
                    symbols: Vec<String>,
                    #[command(flatten)]
                    filter: GraphSymbolArgs,
                    /// Max symbols to list
                    #[arg(short, long, default_value = "50")]
                    limit: usize,
                    /// Rebuild the graph first when it is missing or stale
                    #[arg(long)]
                    refresh: bool,
                },
            }


            fn main() -> Result<()> {
                let cli = Cli::parse();
                // Export the chosen output format so deeply-nested helpers (PathResolver,
                // formatters in subagents) can branch on text vs JSON without us
                // threading `format` through every signature.
                std::env::set_var("AST_INDEX_FORMAT", cli.format.as_str());
                // Both commands read the working tree's own VCS history rather than the
                // indexed symbol tables, so a subtree filter has nothing to filter.
                if cli.subtree.is_some() {
                    if let Some(name) = match &cli.command {
                        Commands::Changed { .. } => Some("changed"),
                        Commands::Hotspots { .. } => Some("hotspots"),
                        _ => None,
                    } {
                        return Err(anyhow::anyhow!(
                            "--subtree is not supported by '{name}'; invoke it from the desired directory"
                        ));
                    }
                }
                if (cli.subtree.is_some() || cli.local)
                    && matches!(
                        &cli.command,
                        Commands::Graph {
                            action: GraphAction::Build { .. } | GraphAction::Status
                        }
                    )
                {
                    return Err(anyhow::anyhow!(
                        "--subtree/--local do not apply to 'graph build' or 'graph status': \
                         the graph always spans every indexed root; pass them to graph queries instead"
                    ));
                }
                // Conflict guard: --subtree and --local both narrow the workspace, but
                // they narrow it differently, so combining them is meaningless.
                if cli.subtree.is_some() && cli.local {
                    eprintln!("Error: --subtree and --local are mutually exclusive.");
                    std::process::exit(2);
                }
                if let Some(name) = &cli.subtree {
                    std::env::set_var("AST_INDEX_SUBTREE", name);
                }
                if cli.local {
                    std::env::set_var("AST_INDEX_LOCAL_SCOPE", "1");
                }
                // Walk-up is opt-in via CLI flag OR AST_INDEX_WALK_UP env var. CLI wins.
                let walk_up = cli.walk_up
                    || std::env::var("AST_INDEX_WALK_UP")
                        .map(|v| {
                            let t = v.trim();
                            !t.is_empty() && t != "0" && !t.eq_ignore_ascii_case("false")
                        })
                        .unwrap_or(false);
                let cache_independent = matches!(
                    &cli.command,
                    Commands::Version
                        | Commands::InstallClaudePlugin
                        | Commands::InstallCodexMcp { .. }
                        | Commands::DetectStacks
                        | Commands::InstallGitHooks { .. }
                        | Commands::Agrep { .. }
                        | Commands::Changed { .. }
                );
                let changed_command = matches!(&cli.command, Commands::Changed { .. });
                let release_command_publication = matches!(&cli.command, Commands::Watch);
                let (root, mut command_cache_lease) = if changed_command {
                    // `changed` discovers only VCS markers from the invocation directory.
                    // It must never probe or create the ast-index cache.
                    (std::env::current_dir()?, None)
                } else if cache_independent {
                    // These commands use only the working tree or executable metadata.
                    // Keep root detection best-effort so a broken cache path cannot make
                    // `version`, stack detection, installers, hooks, or ast-grep fail.
                    (find_project_root_without_cache()?, None)
                } else {
                    match &cli.command {
                        Commands::Rebuild { .. } | Commands::Restore { .. } | Commands::Clear => {
                            let root = find_project_root_for_write()?;
                            (root, None)
                        }
                        _ => {
                            let (root, lease) = find_project_root_for_read_with_lease(walk_up)?;
                            (root, lease)
                        }
                    }
                };
                let format = cli.format.as_str();

                // Migrate project DB from old kotlin-index to ast-index
                if !cache_independent && command_cache_lease.is_none() {
                    command_cache_lease = Some(db::migrate_legacy_project_with_lease(&root)?);
                }
                if release_command_publication {
                    if let Some(lease) = command_cache_lease.as_mut() {
                        lease.release_publication();
                    }
                }
                let _command_cache_lease = command_cache_lease;

                let reads_index = !matches!(
                    &cli.command,
                    Commands::Rebuild { .. }
                        | Commands::Update { .. }
                        | Commands::Restore { .. }
                        | Commands::Clear
                        | Commands::Watch
                        | Commands::WatchStatus { .. }
                        | Commands::AddRoot { .. }
                        | Commands::RemoveRoot { .. }
                        | Commands::Subtree {
                            action: SubtreeAction::Add { .. } | SubtreeAction::Remove { .. }
                        }
                        | Commands::Version
                        | Commands::InstallClaudePlugin
                        | Commands::InstallCodexMcp { .. }
                        | Commands::DetectStacks
                        | Commands::InstallGitHooks { .. }
                        | Commands::Agrep { .. }
                        | Commands::Changed { .. }
                        | Commands::DbPath
                );
                if reads_index && db::db_exists(&root) {
                    let timeout = std::time::Duration::from_millis(
                        std::env::var("AST_INDEX_UPDATE_WAIT_TIMEOUT_MS")
                            .ok()
                            .and_then(|value| value.parse().ok())
                            .unwrap_or(30_000),
                    );
                    db::wait_for_pending_update(&root, timeout)?;
                }

                // Compute directory scope: if cwd is inside project root, limit search to cwd subtree
                let cwd = std::env::current_dir().unwrap_or_default();
                let dir_prefix = if cwd != root {
                    cwd.strip_prefix(&root).ok().map(|rel| {
                        let mut s = rel.to_string_lossy().to_string();
                        if !s.ends_with('/') {
                            s.push('/');
                        }
                        s
                    })
                } else {
                    None
                };
                let dir_prefix_ref = dir_prefix.as_deref();

                match cli.command {
                    // Grep commands
                    Commands::Todo { pattern, limit } => commands::grep::cmd_todo(&root, &pattern, limit),
                    Commands::Callers {
                        function_name,
                        limit,
                        in_file,
                    } => commands::grep::cmd_callers(&root, &function_name, limit, format, in_file.as_deref()),
                    Commands::CallTree {
                        function_name,
                        depth,
                        limit,
                        in_file,
                    } => commands::grep::cmd_call_tree(&root, &function_name, depth, limit, in_file.as_deref()),
                    Commands::Provides { type_name, limit } => {
                        commands::grep::cmd_provides(&root, &type_name, limit)
                    }
                    Commands::Suspend { query, limit } => {
                        commands::grep::cmd_suspend(&root, query.as_deref(), limit)
                    }
                    Commands::Composables { query, limit } => {
                        commands::grep::cmd_composables(&root, query.as_deref(), limit)
                    }
                    Commands::Deprecated { query, limit } => {
                        commands::grep::cmd_deprecated(&root, query.as_deref(), limit)
                    }
                    Commands::Suppress { query, limit } => {
                        commands::grep::cmd_suppress(&root, query.as_deref(), limit)
                    }
                    Commands::Inject { type_name, limit } => {
                        commands::grep::cmd_inject(&root, &type_name, limit)
                    }
                    Commands::Annotations { annotation, limit } => {
                        commands::grep::cmd_annotations(&root, &annotation, limit)
                    }
                    Commands::Deeplinks { query, limit } => {
                        commands::grep::cmd_deeplinks(&root, query.as_deref(), limit)
                    }
                    Commands::Extensions {
                        receiver_type,
                        limit,
                    } => commands::grep::cmd_extensions(&root, &receiver_type, limit),
                    Commands::Flows { query, limit } => {
                        commands::grep::cmd_flows(&root, query.as_deref(), limit)
                    }
                    Commands::Previews { query, limit } => {
                        commands::grep::cmd_previews(&root, query.as_deref(), limit)
                    }
                    // Management commands
                    Commands::Rebuild {
                        r#type,
                        no_deps,
                        no_ignore,
                        sub_projects,
                        verbose,
                        experimental_fast_rebuild,
                        threads,
                        include,
                        exclude,
                        paths,
                        force,
                        remember,
                        max_files,
                    } => {
                        let refresh_generation = db::snapshot_requested_update_generation(&root)?;
                        if let Some(t) = threads {
                            std::env::set_var("AST_INDEX_THREADS", t.to_string());
                        }
                        // Convert per-run flags → env vars so they reach the walker
                        // without threading them through six function signatures.
                        if force {
                            std::env::set_var("AST_INDEX_MAX_FILES", "0");
                        } else if let Some(n) = max_files {
                            std::env::set_var("AST_INDEX_MAX_FILES", n.to_string());
                        }
                        if remember && force {
                            std::env::set_var("AST_INDEX_REMEMBER_BYPASS", "1");
                        } else if remember && !force {
                            eprintln!("[ast-index] --remember has no effect without --force; ignoring");
                        }
                        let result = commands::management::cmd_rebuild(
                            &root,
                            &r#type,
                            !no_deps,
                            no_ignore,
                            sub_projects,
                            verbose,
                            experimental_fast_rebuild,
                            &include,
                            &exclude,
                            &paths,
                        );
                        if result.is_ok() {
                            db::acknowledge_full_refresh(&root, refresh_generation)?;
                            commands::management::ensure_pending_update_worker(&root, 0)?;
                            gc_stale_index_caches(&root);
                        }
                        result
                    }
                    Commands::Update {
                        verbose,
                        background,
                        debounce_ms,
                        coordinator_launch,
                        coordinator_worker,
                        coordinator_claim,
                    } => {
                        let had_index = db::db_exists(&root);
                        let result = if coordinator_worker {
                            commands::management::cmd_update_coordinator_worker(
                                &root,
                                debounce_ms,
                                verbose,
                                coordinator_claim.context("coordinator worker is missing its claim token")?,
                            )
                        } else if coordinator_launch {
                            commands::management::cmd_update_coordinator_launch(
                                &root,
                                debounce_ms,
                                verbose,
                                coordinator_claim.context("coordinator launcher is missing its claim token")?,
                            )
                        } else if background {
                            commands::management::cmd_update_background(&root, debounce_ms, verbose)
                        } else {
                            commands::management::cmd_update(&root, verbose)
                        };
                        if result.is_ok() && had_index {
                            gc_stale_index_caches(&root);
                        }
                        result
                    }
                    Commands::Restore { path } => {
                        let refresh_generation = db::snapshot_requested_update_generation(&root)?;
                        let result = commands::management::cmd_restore(&root, &path);
                        if result.is_ok() {
                            db::acknowledge_full_refresh(&root, refresh_generation)?;
                            commands::management::ensure_pending_update_worker(&root, 0)?;
                        }
                        result
                    }
                    Commands::Stats => commands::management::cmd_stats(&root, format),
                    // Index commands
                    Commands::Search {
                        query,
                        with_content,
                        r#type,
                        limit,
                        in_file,
                        module,
                        fuzzy,
                        rank,
                        exclude_tests,
                    } => {
                        let scope = db::SearchScope {
                            in_file: in_file.as_deref(),
                            module: module.as_deref(),
                            dir_prefix: dir_prefix_ref,
                        };
                        commands::index::cmd_search(
                            &root,
                            &query,
                            r#type.as_deref(),
                            limit,
                            format,
                            &scope,
                            fuzzy,
                            rank.as_deref(),
                            exclude_tests,
                            with_content,
                        )
                    }
                    Commands::Symbol {
                        name,
                        with_content,
                        pattern,
                        r#type,
                        limit,
                        in_file,
                        module,
                        fuzzy,
                    } => {
                        let scope = db::SearchScope {
                            in_file: in_file.as_deref(),
                            module: module.as_deref(),
                            dir_prefix: dir_prefix_ref,
                        };
                        commands::index::cmd_symbol(
                            &root,
                            name.as_deref(),
                            pattern.as_deref(),
