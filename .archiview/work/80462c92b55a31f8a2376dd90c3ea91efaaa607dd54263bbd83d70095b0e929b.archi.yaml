          start_line: 1
          end_line: 44
          text: >
            {
              "description": "Keep the ast-index search index in sync with file edits and session events, and nudge symbol searches toward ast-index.",
              "hooks": {
                "PreToolUse": [
                  {
                    "matcher": "Grep",
                    "hooks": [
                      {
                        "type": "command",
                        "command": "bash ${CLAUDE_PLUGIN_ROOT}/hooks/scripts/grep-reminder.sh",
                        "timeout": 5
                      }
                    ]
                  }
                ],
                "PostToolUse": [
                  {
                    "matcher": "Edit|Write|MultiEdit|NotebookEdit",
                    "hooks": [
                      {
                        "type": "command",
                        "command": "bash ${CLAUDE_PLUGIN_ROOT}/hooks/scripts/post-edit-update.sh",
                        "timeout": 20
                      }
                    ]
                  }
                ],
                "SessionStart": [
                  {
                    "matcher": "*",
                    "hooks": [
                      {
                        "type": "command",
                        "command": "bash ${CLAUDE_PLUGIN_ROOT}/hooks/scripts/session-start-refresh.sh",
                        "timeout": 90,
                        "statusMessage": "Queuing the ast-index project refresh...",
                        "async": true
                      }
                    ]
                  }
                ]
              }
            }
      - index: 309
        fact:
