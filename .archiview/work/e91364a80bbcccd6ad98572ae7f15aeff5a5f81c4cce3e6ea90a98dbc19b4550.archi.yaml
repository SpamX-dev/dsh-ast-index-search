          start_line: 1
          end_line: 49
          text: >
            # ast-index Agent Plugin


            This directory is the shared payload for agent integrations.


            ## Supported Surfaces


            - Claude Code: `.claude-plugin/plugin.json`, `commands/`, and
            `skills/`.

            - Codex: `.codex-plugin/plugin.json` and `skills/`.

            - Cursor: `.cursor-plugin/plugin.json`, `skills/`, `rules/`, and
              `commands-cursor/`.

            The Claude commands are intentionally separate from the Cursor
            command because

            they write different project configuration files.


            For Claude Code, use `/initialize` as the default entrypoint. It
            auto-detects

            single-stack, KMP, and polyglot repos, then configures
            `.claude/settings.json`

            and `.claude/rules/ast-index.md`. The platform-specific
            `/initialize-*`

            commands remain available as manual overrides.


            ## Local Testing


            Codex can load the skill directly from `~/.codex/skills`:


            ```bash

            mkdir -p ~/.codex/skills

            ln -s
            /absolute/path/to/Claude-ast-index-search/plugin/skills/ast-index
            ~/.codex/skills/ast-index

            ```


            The repo marketplace at `.agents/plugins/marketplace.json` is kept
            for Codex

            builds that support plugin marketplaces.


            Cursor can load the skill directly from `~/.cursor/skills`:


            ```bash

            mkdir -p ~/.cursor/skills

            ln -s
