            - `outline` and `imports` work with PHP files


            ### Perl


            Consult: `references/perl-commands.md`


            - **Exports**: `perl-exports`

            - **Subroutines**: `perl-subs`

            - **POD**: `perl-pod`

            - **Imports**: `perl-imports`

            - **Tests**: `perl-tests`


            ### Module Analysis


            Consult: `references/module-commands.md`


            - **Module Search**: `module`

            - **Dependencies**: `deps`, `dependents`

            - **Unused Dependencies**: `unused-deps`

            - **Unused Symbols**: `unused-symbols`

            - **Public API**: `api`


            ## Workflow Recommendations


            1. Run `ast-index rebuild` once in project root to build the index

            2. **Start a session** with `ast-index conventions` + `ast-index
            map` to understand project structure (~80 lines, ~500 tokens)

            3. Use `ast-index map --module <path>` to drill down into specific
            areas

            4. Use `ast-index search` for quick universal search when exploring

            5. Use `ast-index class` for precise class/interface lookup

            6. Use `ast-index usages` to find all references before refactoring
            (`graph dependents` for the dependents of one definition)

            7. Use `ast-index implementations` to understand inheritance

            8. Use `ast-index changed --base main` to inventory branch files
            before code review

            9. Run `ast-index update` periodically to keep index fresh


            ## JSON Output (Optional)


            **Default output is human-readable plain text** — use it unless you
            specifically need structured data for scripting.


            Add `--format json` only when:

            - Parsing output programmatically (pipelines, scripts)

            - Need exact field values (file paths, statuses, line numbers,
            symbol kinds)

            - Integrating with another tool


            Commands with JSON output include `search`, `explore`, `file`,
            `symbol`, `class`, `usages`, `callers`, `implementations`, `refs`,
            `stats`, `changed`, `hotspots`, `graph …`, `unused-symbols`, `map`
            and `conventions`; others (`outline`, `call-tree`, `hierarchy`,
            `imports`, `todo`) print text either way.


            ```bash

            ast-index --format json search "Query" | jq '.symbols[].path'

            ```


